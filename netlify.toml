[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/works"
  to = "/work"
  status = 301

[[redirects]]
  from = "/works/*"
  to = "/work/:splat"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/about"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/about/"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/work.html"
  to = "/work"
  status = 301

[[redirects]]
  from = "/services.html"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/services"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/services/"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
