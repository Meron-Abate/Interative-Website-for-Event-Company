# Nginx server configuration snippet for clean URLs
server {
    listen 80;
    server_name eternalstudio.com www.eternalstudio.com;
    root /var/www/eternal;
    index index.html;

    # Redirect /works to /work
    location = /works {
        return 301 /work/;
    }

    # Redirect /index.html to /
    location = /index.html {
        return 301 /;
    }

    # Redirect direct *.html to clean URL
    if ($request_uri ~ ^/(.*)\.html$) {
        return 301 /$1/;
    }

    # Clean URL handling: try exact file, directory, or .html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Security & gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
