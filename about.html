<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Immediately set dark theme to prevent flash of light mode -->
  <script>
    (function(){
      var saved = localStorage.getItem('eternal-theme-v2');
      if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=/#about">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to ETERNAL About Us...</title>
  <link rel="canonical" href="https://eternalstudio.com/#about">
  <script>window.location.replace('/#about' + window.location.search);</script>
</head>
<body style="background: #080808; color: #fff; font-family: Lato, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p>Redirecting to <a href="/#about" style="color: #FF5636;">About Us</a>...</p>
</body>
</html>
